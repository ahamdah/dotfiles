# lazygit — Gruvbox Dark, matching the iTerm2 profile, tmux, and zsh prompt.
# Linked by scripts/link.sh to the per-OS lazygit config dir.
gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor:
      - "#fabd2f" # yellow
      - bold
    inactiveBorderColor:
      - "#665c54" # bg3
    searchingActiveBorderColor:
      - "#fe8019" # orange
      - bold
    optionsTextColor:
      - "#83a598" # blue
    selectedLineBgColor:
      - "#3c3836" # bg1
    inactiveViewSelectedLineBgColor:
      - "#32302f" # bg0_s
    cherryPickedCommitFgColor:
      - "#8ec07c" # aqua
    cherryPickedCommitBgColor:
      - "#504945" # bg2
    markedBaseCommitFgColor:
      - "#83a598" # blue
    markedBaseCommitBgColor:
      - "#504945" # bg2
    unstagedChangesColor:
      - "#fb4934" # red
    defaultFgColor:
      - "#ebdbb2" # fg
  authorColors:
    "*": "#d3869b" # purple
